name = "personal-website"
main = "src/toledo-proxy.js"
compatibility_date = "2026-11-16"
workers_dev = false
preview_urls = false

[assets]
directory = "./public"
run_worker_first = ["/toledo", "/toledo/*"]

[[services]]
binding = "TOLEDO"
service = "toledo-landing"

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true


